<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Pravilno mjerenje krvnog tlaka</title><desc id="d">Originalna edukativna shema pravilnog položaja bolesnika i manžete</desc><defs><style>.tx{font:700 29px Arial;fill:#17324d}.sm{font:500 21px Arial;fill:#334155}.lab{font:700 19px Arial;fill:#17324d}.box{fill:#f8fbfd;stroke:#d6e2ea;stroke-width:2}.teal{fill:#0f766e}</style></defs><rect width="1200" height="700" fill="white"/><rect x="285" y="22" width="630" height="64" rx="28" class="teal"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="white">Pravilno mjerenje krvnog tlaka</text><g transform="translate(420,145)"><circle cx="160" cy="70" r="48" fill="#e7b89b"/><rect x="105" y="118" width="110" height="170" rx="38" fill="#6fa7c9"/><path d="M115 155 L35 260" stroke="#e7b89b" stroke-width="32" stroke-linecap="round"/><path d="M205 155 L335 180" stroke="#e7b89b" stroke-width="32" stroke-linecap="round"/><rect x="310" y="155" width="72" height="52" rx="8" fill="#334155"/><path d="M120 280 L90 430" stroke="#314b62" stroke-width="34" stroke-linecap="round"/><path d="M200 280 L230 430" stroke="#314b62" stroke-width="34" stroke-linecap="round"/><line x1="60" y1="445" x2="120" y2="445" stroke="#172133" stroke-width="16" stroke-linecap="round"/><line x1="200" y1="445" x2="260" y2="445" stroke="#172133" stroke-width="16" stroke-linecap="round"/><rect x="20" y="250" width="280" height="18" rx="9" fill="#94a3b8"/><rect x="35" y="260" width="20" height="195" fill="#94a3b8"/><rect x="285" y="260" width="20" height="195" fill="#94a3b8"/><rect x="250" y="165" width="150" height="18" rx="9" fill="#94a3b8"/></g><g><rect x="45" y="135" width="310" height="210" rx="18" class="box"/><text x="70" y="175" class="tx">Položaj bolesnika</text><text x="70" y="215" class="sm">• odmor 5 minuta</text><text x="70" y="250" class="sm">• leđa oslonjena</text><text x="70" y="285" class="sm">• stopala na podu</text><text x="70" y="320" class="sm">• noge ne prekrižiti</text><rect x="845" y="135" width="310" height="210" rx="18" class="box"/><text x="870" y="175" class="tx">Ruka i manžeta</text><text x="870" y="215" class="sm">• ruka u razini srca</text><text x="870" y="250" class="sm">• gola nadlaktica</text><text x="870" y="285" class="sm">• odgovarajuća veličina</text><text x="870" y="320" class="sm">• validirani uređaj</text><rect x="45" y="420" width="1110" height="190" rx="18" class="box"/><text x="70" y="460" class="tx">Česte pogreške</text><text x="70" y="505" class="sm">razgovor tijekom mjerenja · prekrižene noge · nepoduprta ruka · manžeta preko odjeće · premala manžeta</text><text x="70" y="550" class="sm">Ponovi mjerenje prema protokolu i procjenjuj prosjek / trend, a ne samo jednu brojku.</text></g><text x="600" y="665" text-anchor="middle" class="sm">Pravilna tehnika smanjuje rizik pogrešne procjene krvnog tlaka</text></svg>