<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Srčano popuštanje i plućni edem</title><desc id="d">Originalna edukativna shema slabe pumpne funkcije, plućne kongestije i edema</desc><defs><style>.tx{font:700 29px Arial;fill:#17324d}.sm{font:500 21px Arial;fill:#334155}.lab{font:700 19px Arial;fill:#17324d}.box{fill:#f8fbfd;stroke:#d6e2ea;stroke-width:2}.teal{fill:#0f766e}</style></defs><rect width="1200" height="700" fill="white"/><rect x="275" y="22" width="650" height="64" rx="28" class="teal"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="white">Srčano popuštanje i plućni edem</text><g transform="translate(80,145)"><path d="M180 70 C110 0 20 65 50 180 C78 280 165 330 180 400 C198 330 285 280 315 180 C345 65 250 0 195 70Z" fill="#f4b8b8" stroke="#b91c1c" stroke-width="5"/><path d="M180 70 V390" stroke="white" stroke-width="8"/><ellipse cx="120" cy="165" rx="55" ry="50" fill="#afd2f3"/><ellipse cx="240" cy="165" rx="55" ry="50" fill="#f1a9a9"/><ellipse cx="120" cy="285" rx="60" ry="80" fill="#95c5ef"/><ellipse cx="240" cy="285" rx="60" ry="80" fill="#ed9999"/><path d="M220 280 Q250 245 270 285" fill="none" stroke="#7f1d1d" stroke-width="12"/><text x="175" y="455" text-anchor="middle" class="tx">↓ minutni volumen</text></g><g transform="translate(790,155)"><ellipse cx="110" cy="180" rx="90" ry="155" fill="#f7c5c5" stroke="#d97777" stroke-width="4"/><ellipse cx="260" cy="180" rx="90" ry="155" fill="#f7c5c5" stroke="#d97777" stroke-width="4"/><path d="M185 15 V125 M185 125 C145 135 125 155 110 180 M185 125 C225 135 245 155 260 180" fill="none" stroke="#4c8ed9" stroke-width="18" stroke-linecap="round"/><g fill="#b7d7f6" opacity=".85"><circle cx="110" cy="240" r="35"/><circle cx="85" cy="285" r="30"/><circle cx="140" cy="285" r="32"/><circle cx="260" cy="240" r="35"/><circle cx="235" cy="285" r="30"/><circle cx="290" cy="285" r="32"/></g><text x="185" y="390" text-anchor="middle" class="tx">tekućina u alveolama</text></g><g><rect x="420" y="135" width="330" height="80" rx="18" class="box"/><text x="445" y="168" class="tx">1 Slabija pumpna funkcija</text><text x="445" y="198" class="sm">lijeva klijetka izbacuje manje krvi</text><rect x="420" y="235" width="330" height="80" rx="18" class="box"/><text x="445" y="268" class="tx">2 Plućna kongestija</text><text x="445" y="298" class="sm">raste tlak u venama i kapilarama</text><rect x="420" y="335" width="330" height="80" rx="18" class="box"/><text x="445" y="368" class="tx">3 Edem alveola</text><text x="445" y="398" class="sm">tekućina otežava izmjenu plinova</text><rect x="420" y="435" width="330" height="80" rx="18" class="box"/><text x="445" y="468" class="tx">4 Dispneja + hipoksemija</text><text x="445" y="498" class="sm">potrebna brza procjena i liječenje</text></g><g><rect x="70" y="560" width="1060" height="90" rx="20" class="box"/><text x="95" y="595" class="tx">Prioriteti zdravstvene njege</text><text x="95" y="630" class="sm">povišen položaj · SpO₂ · praćenje disanja · venski put · kisik/terapija po ordinaciji · spremnost za hitnu reakciju</text></g></svg>