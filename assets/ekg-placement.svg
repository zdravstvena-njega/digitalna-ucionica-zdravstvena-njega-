<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">EKG – elektrode i odvodi</title><desc id="d">Originalna edukativna shema položaja 10 elektroda za 12-kanalni EKG</desc><defs><style>.tx{font:700 30px Arial;fill:#17324d}.sm{font:500 21px Arial;fill:#334155}.lab{font:700 20px Arial;fill:#17324d}.box{fill:#f8fbfd;stroke:#d6e2ea;stroke-width:2}.teal{fill:#0f766e}</style></defs><rect width="1200" height="700" fill="white"/><rect x="325" y="22" width="550" height="64" rx="28" class="teal"/><text x="600" y="66" text-anchor="middle" font-family="Arial" font-size="37" font-weight="700" fill="white">EKG – elektrode i odvodi</text><path d="M470 145 C420 180 390 265 400 360 L420 620 H780 L800 360 C810 265 780 180 730 145 C675 112 525 112 470 145Z" fill="#f2c9ad" stroke="#c99576" stroke-width="4"/><path d="M600 150 V610" stroke="#e0aa8b" stroke-width="3" opacity=".5"/><g stroke="#d9b29d" stroke-width="3" fill="none" opacity=".75"><path d="M465 250 Q600 190 735 250"/><path d="M450 290 Q600 230 750 290"/><path d="M445 335 Q600 275 755 335"/><path d="M450 380 Q600 320 750 380"/><path d="M465 425 Q600 365 735 425"/></g><g><circle cx="465" cy="205" r="18" fill="#ef4444"/><text x="430" y="180" class="lab">RA</text><circle cx="735" cy="205" r="18" fill="#f59e0b"/><text x="750" y="180" class="lab">LA</text><circle cx="470" cy="560" r="18" fill="#22c55e"/><text x="430" y="600" class="lab">RL</text><circle cx="730" cy="560" r="18" fill="#111827"/><text x="750" y="600" class="lab">LL</text></g><g class="lab"><circle cx="560" cy="310" r="16" fill="#ef4444"/><text x="535" y="285">V1</text><circle cx="620" cy="310" r="16" fill="#f59e0b"/><text x="605" y="285">V2</text><circle cx="650" cy="350" r="16" fill="#22c55e"/><text x="640" y="330">V3</text><circle cx="680" cy="390" r="16" fill="#92400e"/><text x="670" y="370">V4</text><circle cx="735" cy="405" r="16" fill="#111827"/><text x="725" y="382">V5</text><circle cx="790" cy="420" r="16" fill="#7e22ce"/><text x="785" y="395">V6</text></g><rect x="40" y="130" width="300" height="210" rx="18" class="box"/><text x="65" y="168" class="tx">Položaj V1–V6</text><text x="65" y="208" class="sm">V1: 4. MRP desno sternum</text><text x="65" y="242" class="sm">V2: 4. MRP lijevo sternum</text><text x="65" y="276" class="sm">V3: između V2 i V4</text><text x="65" y="310" class="sm">V4: 5. MRP, MCL</text><text x="65" y="344" class="sm">V5–V6: aksilarne linije</text><rect x="860" y="130" width="300" height="210" rx="18" class="box"/><text x="885" y="168" class="tx">10 elektroda</text><text x="885" y="208" class="sm">→ 12 EKG odvoda</text><text x="885" y="248" class="sm">I, II, III</text><text x="885" y="282" class="sm">aVR, aVL, aVF</text><text x="885" y="316" class="sm">V1–V6</text><rect x="860" y="380" width="300" height="190" rx="18" class="box"/><text x="885" y="420" class="tx">Česte pogreške</text><text x="885" y="460" class="sm">• loš kontakt kože</text><text x="885" y="494" class="sm">• pokret / tremor</text><text x="885" y="528" class="sm">• pogrešan položaj</text><path d="M880 615 h40 l12-35 18 70 18-55 16 20 h55" fill="none" stroke="#0f766e" stroke-width="5"/><text x="600" y="670" text-anchor="middle" class="sm">Točan položaj elektroda = kvalitetniji zapis i sigurnija procjena</text></svg>