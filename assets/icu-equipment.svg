<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
<title id="t">Oprema JIKS-a i JIL-a</title><desc id="d">Originalna edukativna ilustracija monitora, defibrilatora, infuzijske pumpe, aspiratora, ventilacijske potpore i kolica za reanimaciju.</desc>
<defs><style>.bg{fill:#f7fbfc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 25px Arial;fill:#0f766e}.t{font:600 18px Arial;fill:#172133}.s{font:15px Arial;fill:#475569}.line{stroke:#0f766e;stroke-width:4;fill:none}.red{stroke:#dc2626;fill:none;stroke-width:4}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.screen{fill:#0f172a}.green{stroke:#22c55e;stroke-width:4;fill:none}.metal{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.teal{fill:#ccfbf1;stroke:#0f766e;stroke-width:3}</style></defs>
<rect class="bg" width="1200" height="820" rx="28"/><text x="55" y="58" class="h" style="font-size:34px">Oprema u jedinici intenzivne koronarne skrbi / JIL-u</text><text x="55" y="88" class="s">Prepoznaj uređaj → znaš svrhu → provjeri sigurnost → prati bolesnika, ne samo brojke.</text>
<!-- monitor --> <rect class="card" x="45" y="125" width="350" height="285" rx="22"/><text class="h" x="70" y="162">Bedside monitor</text><rect class="screen" x="80" y="190" width="280" height="130" rx="12"/><path class="green" d="M95 260h35l10-18 12 42 17-62 15 38h27l11-16 10 18h36l11-28 14 26h43"/><text x="95" y="214" fill="#86efac" font-family="Arial" font-size="15">ECG  •  SpO₂  •  NIBP  •  RR</text><rect class="metal" x="155" y="330" width="130" height="18" rx="6"/><line x1="220" y1="348" x2="220" y2="380" class="line"/><text x="70" y="393" class="s">Kontinuirano praćenje ritma i vitalnih parametara.</text>
<!-- defib --> <rect class="card" x="425" y="125" width="350" height="285" rx="22"/><text class="h" x="450" y="162">Defibrilator</text><rect class="screen" x="470" y="190" width="210" height="92" rx="10"/><path class="green" d="M485 238h26l8-12 9 27 11-42 10 26h31l8-11 10 14h62"/><circle cx="505" cy="319" r="17" fill="#f59e0b"/><circle cx="556" cy="319" r="17" fill="#22c55e"/><circle cx="607" cy="319" r="17" fill="#ef4444"/><path d="M690 205l40-18 22 45-39 18z" class="metal"/><path d="M690 260l40 18 22-45-39-18z" class="metal"/><text x="450" y="393" class="s">Defibrilacija, sinkronizirana kardioverzija, pacing, monitoring.</text>
<!-- pumps --> <rect class="card" x="805" y="125" width="350" height="285" rx="22"/><text class="h" x="830" y="162">Infuzijska / štrcaljkasta pumpa</text><rect class="metal" x="860" y="190" width="235" height="135" rx="15"/><rect class="screen" x="890" y="210" width="120" height="52" rx="6"/><text x="905" y="243" fill="#a7f3d0" font-family="Arial" font-size="18">2.0 mL/h</text><rect x="880" y="282" width="175" height="19" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/><line x1="1055" y1="291" x2="1110" y2="291" class="line"/><line x1="1110" y1="291" x2="1110" y2="365" class="line"/><circle cx="1110" cy="365" r="7" fill="#0f766e"/><text x="830" y="393" class="s">Precizno doziranje kontinuirane IV terapije; provjeri koncentraciju i brzinu.</text>
<!-- suction --> <rect class="card" x="45" y="440" width="350" height="300" rx="22"/><text class="h" x="70" y="477">Aspirator</text><circle class="teal" cx="155" cy="565" r="58"/><circle cx="155" cy="565" r="19" fill="#fff" stroke="#0f766e" stroke-width="3"/><path class="line" d="M212 565h75c30 0 30 55 60 55"/><rect x="105" y="642" width="100" height="55" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="75" y="720" class="s">Uklanjanje sekreta/krvi iz dišnog puta kada je indicirano.</text>
<!-- ventilation --> <rect class="card" x="425" y="440" width="350" height="300" rx="22"/><text class="h" x="450" y="477">Kisik / NIV / ventilator</text><rect class="metal" x="475" y="515" width="190" height="120" rx="14"/><rect class="screen" x="500" y="535" width="130" height="58" rx="8"/><path d="M515 574c18-32 36 32 54 0s36 32 54 0" stroke="#38bdf8" stroke-width="4" fill="none"/><path d="M665 555c65 0 60 85 92 85" class="blue" fill="none"/><path d="M710 615c22 0 40 10 47 25-7 18-25 28-47 28-14 0-27-4-37-12 10-7 10-24 0-31 10-7 23-10 37-10z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="450" y="720" class="s">Potpora oksigenaciji i ventilaciji prema indikaciji i liječničkom planu.</text>
<!-- crash cart --> <rect class="card" x="805" y="440" width="350" height="300" rx="22"/><text class="h" x="830" y="477">Kolica za reanimaciju</text><rect x="875" y="515" width="195" height="145" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><line x1="875" y1="550" x2="1070" y2="550" stroke="#94a3b8" stroke-width="2"/><line x1="875" y1="590" x2="1070" y2="590" stroke="#94a3b8" stroke-width="2"/><line x1="875" y1="630" x2="1070" y2="630" stroke="#94a3b8" stroke-width="2"/><rect x="930" y="493" width="90" height="26" rx="6" fill="#ef4444"/><text x="948" y="512" fill="#fff" font-family="Arial" font-size="15" font-weight="700">HITNO</text><circle cx="905" cy="676" r="16" fill="#475569"/><circle cx="1040" cy="676" r="16" fill="#475569"/><text x="830" y="720" class="s">Standardizirana oprema i terapija za hitno zbrinjavanje i reanimaciju.</text>
<text x="55" y="785" class="s">Digitalna učionica – Zdravstvena njega • edukativna originalna ilustracija</text></svg>